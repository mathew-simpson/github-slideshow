; EA16 Pullback Capture - in-sample optimisation (PULLBACK_SYSTEM_SPEC.md sections 3-5)
; Launch: terminal64.exe /config:<full path to this file>   (close the terminal first)
; Assumes the MT5_EAs folder sits in <data folder>\MQL5\Experts\ and EA16 is compiled.
; Full grid (Optimization=1, 700 passes), not genetic, so one run covers every combination.
; Do not change dates, ranges or fixed inputs without bumping the spec version.

[Tester]
Expert=MT5_EAs\EA16_PullbackCapture
Symbol=EURUSD
Period=H1
Model=1
FromDate=2015.01.01
ToDate=2022.12.31
ForwardMode=0
Deposit=10000
Currency=USD
Leverage=100
Optimization=1
OptimizationCriterion=7
Visual=0
ShutdownTerminal=1
Report=reports\EA16_EURUSD_H1_IS
ReplaceReport=1

[TesterInputs]
; param=value||start||step||stop||Y(optimize)/N
H1_FastMA=20||10||5||30||Y
TargetRetrace=0.5||0.3||0.1||0.7||Y
SL_ATR_Buffer=0.5||0.25||0.25||1.0||Y
MaxHoldBars=24||12||6||48||Y
D1_TrendMA=50||50||1||50||N
D1_SlopeBars=5||5||1||5||N
D1_MinADX=20.0||20.0||1.0||20.0||N
ImpulseLookback=48||48||1||48||N
FreshBars=12||12||1||12||N
MinLegATR=3.0||3.0||1.0||3.0||N
MinRR=1.0||1.0||1.0||1.0||N
MaxSpreadPoints=20||20||1||20||N
MaxSpreadFrac=0.10||0.10||0.01||0.10||N
RiskPercent=0.5||0.5||0.1||0.5||N
StartHour=7||7||1||7||N
EndHour=20||20||1||20||N
